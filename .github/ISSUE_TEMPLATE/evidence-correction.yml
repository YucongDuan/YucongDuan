name: Evidence, navigation or translation
description: Correct a source, broken route, project classification or translation.
title: '[Correction] '
body:
- type: input
  id: location
  attributes:
    label: Affected page or repository
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Current passage and proposed correction
  validations:
    required: true
- type: textarea
  id: source
  attributes:
    label: Supporting source or example
    description: For a research claim, include the original source, authors, date and exactly what it supports.
  validations:
    required: true

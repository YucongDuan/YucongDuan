name: Reproduction report
description: Share a result, failure or cross-project reproduction issue.
title: '[Reproduction] '
body:
- type: markdown
  attributes:
    value: For a bug in one project, prefer that project's issue tracker. Use minimal synthetic examples and remove secrets
      from logs.
- type: input
  id: revision
  attributes:
    label: Repository and exact commit
  validations:
    required: true
- type: input
  id: environment
  attributes:
    label: Environment
    placeholder: OS, Python or Node version, dependency installation method
  validations:
    required: true
- type: textarea
  id: commands
  attributes:
    label: Commands and minimal input
    render: text
  validations:
    required: true
- type: textarea
  id: result
  attributes:
    label: Expected and observed result
    description: Include exit status and a short output or receipt summary. Negative results are welcome.
  validations:
    required: true

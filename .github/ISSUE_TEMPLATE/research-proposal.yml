name: Research proposal
description: Propose one question, method and inspectable contribution.
title: '[Research] '
body:
- type: markdown
  attributes:
    value: Written proposals support asynchronous review. Use the relevant project's tracker for a code bug.
- type: textarea
  id: question
  attributes:
    label: Research question
    description: What question would this work answer? What prior work should be compared?
  validations:
    required: true
- type: input
  id: project
  attributes:
    label: Relevant repository or paper
  validations:
    required: true
- type: textarea
  id: method
  attributes:
    label: Method and possible counterevidence
    description: Describe inputs, comparison, evaluation and a result that would weaken the hypothesis.
  validations:
    required: true
- type: textarea
  id: contribution
  attributes:
    label: Your contribution and intended artifact
    placeholder: 'For example: a reproducible benchmark comparison, adapter, test set or paper draft.'
  validations:
    required: true

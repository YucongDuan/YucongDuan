name: Portfolio consistency
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check reproducible portfolio pages
        run: node scripts/build_portfolio.mjs --check
      - name: Check inventory coverage and local links
        run: node scripts/validate_portfolio.mjs
